<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-label="Zarrar.Solutions ZS monogram">
  <title>Zarrar.Solutions</title>
  <defs>
    <linearGradient id="zs-copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef9d5c"/>
      <stop offset=".55" stop-color="#d97b3f"/>
      <stop offset="1" stop-color="#a34a24"/>
    </linearGradient>
    <linearGradient id="zs-rust" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#c2603f"/>
      <stop offset="1" stop-color="#a34a2c"/>
    </linearGradient>
  </defs>

  <!-- ============ Z ============
       Slab Z: top bar, parallel diagonal band, bottom bar.
       Layer order: maroon drop -> dark keyline -> rust fill -> cream inline. -->

  <!-- maroon offset shadow -->
  <path d="M156,156 H328 V199 L238,320 H328 V363 H156 V320 L246,199 H156 Z"
        fill="#611a0c"/>

  <!-- dark keyline -->
  <path d="M150,150 H322 V193 L232,314 H322 V357 H150 V314 L240,193 H150 Z"
        fill="none" stroke="#0a0403" stroke-width="13" stroke-linejoin="miter"/>

  <!-- rust body -->
  <path d="M150,150 H322 V193 L232,314 H322 V357 H150 V314 L240,193 H150 Z"
        fill="url(#zs-rust)"/>

  <!-- cream inline, inset and parallel to the contour -->
  <path d="M166,166 H306 V181 L220,301 H306 V341 H166 V326 L252,206 H166 Z"
        fill="none" stroke="#f2e2c4" stroke-width="7" stroke-linejoin="miter"/>

  <!-- ============ S ============
       Sits over the Z's diagonal, right of centre.
       Layer order: keyline -> copper body -> cream highlights -> maroon shade. -->

  <!-- dark keyline -->
  <path d="M366,212 C364,182 336,158 308,164 C282,170 266,193 274,215
           C282,238 314,250 335,264 C357,279 369,303 357,327
           C344,352 309,360 283,346 C267,337 259,321 258,308"
        fill="none" stroke="#0a0403" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- copper body -->
  <path d="M366,212 C364,182 336,158 308,164 C282,170 266,193 274,215
           C282,238 314,250 335,264 C357,279 369,303 357,327
           C344,352 309,360 283,346 C267,337 259,321 258,308"
        fill="none" stroke="url(#zs-copper)" stroke-width="23"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- maroon shade along the lower-right of the bowl -->
  <path d="M343,272 C362,287 371,308 360,328 C351,345 328,354 307,353"
        fill="none" stroke="#611a0c" stroke-width="7"
        stroke-linecap="round"/>

  <!-- cream highlight, upper terminal -->
  <path d="M352,202 C346,184 328,172 309,176 C292,180 282,194 284,208"
        fill="none" stroke="#f2e2c4" stroke-width="6"
        stroke-linecap="round"/>

  <!-- cream highlight, lower bowl -->
  <path d="M347,314 C349,332 332,346 311,346 C298,346 287,340 281,331"
        fill="none" stroke="#f2e2c4" stroke-width="6"
        stroke-linecap="round"/>
</svg>
