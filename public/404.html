<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Page ripped out · Muhammad Zarrar</title>
    <style>
      :root {
        --canvas: #fcfaf7;
        --canvas-deep: #f1e9dd;
        --surface: #fffefb;
        --ink: #17130f;
        --ink-soft: #4e4740;
        --muted: #5a534b;
        --line: #e6dccf;
        --line-strong: #8f816f;
        --clay: #c46b4d;
        --clay-deep: #a85a41;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { -webkit-font-smoothing: antialiased; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--canvas);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        padding: 2rem;
      }
      .page {
        position: relative;
        max-width: 560px;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 16px;
        padding: 3.5rem 2.5rem 4rem;
        text-align: center;
        box-shadow:
          0 1px 0 0 rgba(255, 255, 255, 0.05) inset,
          0 4px 6px -1px rgb(0 0 0 / 0.15),
          0 2px 4px -2px rgb(0 0 0 / 0.1);
        clip-path: polygon(
          0 0, 100% 0, 100% 90%,
          96% 94%, 92% 90%, 88% 95%, 83% 91%, 78% 96%, 73% 91%, 68% 95%,
          63% 90%, 58% 96%, 52% 91%, 47% 95%, 42% 90%, 37% 96%, 32% 92%,
          27% 95%, 22% 91%, 16% 96%, 11% 92%, 5% 95%, 0 91%
        );
      }
      /* Paper clip */
      .clip {
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%) rotate(-6deg);
        opacity: 0.55;
      }
      .stamp {
        display: inline-block;
        transform: rotate(-8deg);
        border: 1.5px solid var(--clay-deep);
        color: var(--clay-deep);
        font-family: "Trebuchet MS", Verdana, sans-serif;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 3px 10px;
        border-radius: 3px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin-top: 2rem;
        font-size: clamp(4rem, 18vw, 7rem);
        font-weight: 300;
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      .mono {
        font-family: "Courier New", ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 1.5rem;
      }
      p.rip {
        margin-top: 1rem;
        font-size: 17px;
        line-height: 1.65;
        color: var(--ink-soft);
      }
      a.home {
        display: inline-block;
        margin-top: 2.25rem;
        background: var(--ink);
        color: var(--canvas);
        font-family: "Trebuchet MS", Verdana, sans-serif;
        font-size: 14px;
        text-decoration: none;
        padding: 12px 28px;
        border-radius: 999px;
        transition: background 0.3s ease;
      }
      a.home:hover { background: var(--clay-deep); }
      .torn {
        margin-top: 2.5rem;
        color: var(--line-strong);
        font-family: "Courier New", ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <!-- Paper clip -->
      <svg class="clip" width="22" height="52" viewBox="0 0 20 48" fill="none">
        <path d="M 7 2 C 14 2, 18 6, 18 14 L 18 34 C 18 40, 14 44, 10 44 C 6 44, 3 40, 3 34 L 3 12 C 3 7, 6 4, 10 4" stroke="#17130f" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.4" />
        <path d="M 10 4 C 13 4, 15 7, 15 12 L 15 32 C 15 37, 13 39, 10 39 C 7 39, 6 37, 6 32 L 6 14" stroke="#17130f" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.2" />
      </svg>

      <span class="stamp">Ripped out</span>
      <h1>404</h1>
      <div class="mono">— notebook archive —</div>
      <p class="rip">
        This page was ripped out of the notebook.<br />
        It probably never existed — or it moved somewhere better.
      </p>
      <a class="home" href="/">← Back to the notebook</a>
      <div class="torn">MZ · Rawalpindi</div>
    </main>
  </body>
</html>
