<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">
  <!-- ============================================================
       CONTACT ENVELOPE — ANIMATION WIREFRAME / STORYBOARD
       Import into Figma (File > Place) — layers + text stay editable.
       Palette: canvas #FCFAF7 · ink #17130F · clay #C46B4D · muted #5A534B · line #E6DCCF
       ============================================================ -->

  <!-- Canvas -->
  <rect width="1440" height="900" fill="#FCFAF7"/>
  <rect x="0.5" y="0.5" width="1439" height="899" fill="none" stroke="#E6DCCF"/>

  <!-- Header -->
  <text x="48" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#17130F" font-style="italic">The envelope — animation wireframe</text>
  <text x="48" y="76" font-size="11" fill="#5A534B" letter-spacing="2">CONTACT SECTION · 5 STATES · TIMING + EASING SPEC · DROP INTO FIGMA</text>
  <text x="1392" y="52" font-size="11" fill="#C46B4D" text-anchor="end" letter-spacing="1">v3 — pick-up beat added</text>
  <line x1="48" y1="92" x2="1392" y2="92" stroke="#E6DCCF"/>

  <!-- ================= FRAME 01 — REST ================= -->
  <g>
    <rect x="48" y="112" width="240" height="330" fill="none" stroke="#E6DCCF"/>
    <text x="60" y="134" font-size="11" fill="#17130F" font-weight="bold" letter-spacing="1">01 — REST</text>
    <text x="276" y="134" font-size="10" fill="#5A534B" text-anchor="end">closed</text>

    <!-- envelope body -->
    <rect x="78" y="200" width="180" height="112" rx="10" fill="#FFFEFB" stroke="#17130F" stroke-opacity="0.55"/>
    <!-- flap closed -->
    <polygon points="78,200 258,200 168,263" fill="#F5EEE4" stroke="#17130F" stroke-opacity="0.55"/>
    <!-- wax seal -->
    <circle cx="168" cy="258" r="14" fill="#C46B4D"/>
    <text x="168" y="262" font-size="9" fill="#FCFAF7" text-anchor="middle" font-weight="bold">MZ</text>
    <!-- address -->
    <text x="168" y="288" font-size="8" fill="#5A534B" text-anchor="middle">to — someone with an idea</text>
    <text x="168" y="300" font-size="7" fill="#8C857C" text-anchor="middle" letter-spacing="1">FROM — ZARRAR · RAWALPINDI</text>
    <!-- hint -->
    <text x="168" y="336" font-size="8" fill="#8C857C" text-anchor="middle" letter-spacing="2">— CLICK TO OPEN —</text>

    <text x="60" y="368" font-size="9" fill="#5A534B">· default state on scroll-in</text>
    <text x="60" y="384" font-size="9" fill="#5A534B">· whole thing is one &lt;button&gt;</text>
    <text x="60" y="400" font-size="9" fill="#5A534B">· idle = still (quiet design)</text>
    <text x="60" y="424" font-size="9" fill="#C46B4D">a11y: aria-label "Open the envelope"</text>
  </g>

  <!-- arrow -->
  <text x="303" y="262" font-size="16" fill="#C46B4D" text-anchor="middle">›</text>
  <text x="303" y="278" font-size="8" fill="#8C857C" text-anchor="middle">hover</text>

  <!-- ================= FRAME 02 — HOVER ================= -->
  <g>
    <rect x="324" y="112" width="240" height="330" fill="none" stroke="#E6DCCF"/>
    <text x="336" y="134" font-size="11" fill="#17130F" font-weight="bold" letter-spacing="1">02 — HOVER</text>
    <text x="552" y="134" font-size="10" fill="#5A534B" text-anchor="end">whimsy</text>

    <!-- letter peeking above -->
    <rect x="372" y="178" width="144" height="30" rx="4" fill="#FCFAF7" stroke="#17130F" stroke-opacity="0.35" stroke-dasharray="3 2"/>
    <!-- envelope body (lifted -4px) -->
    <rect x="354" y="196" width="180" height="112" rx="10" fill="#FFFEFB" stroke="#17130F" stroke-opacity="0.55"/>
    <!-- flap tilted -->
    <polygon points="354,196 534,196 444,247" fill="#F5EEE4" stroke="#17130F" stroke-opacity="0.55"/>
    <!-- seal tilted -->
    <g transform="rotate(-3 444 251)">
      <circle cx="444" cy="251" r="14" fill="#C46B4D"/>
      <text x="444" y="255" font-size="9" fill="#FCFAF7" text-anchor="middle" font-weight="bold">MZ</text>
    </g>
    <!-- motion arcs -->
    <path d="M 444 240 A 26 26 0 0 1 468 224" fill="none" stroke="#C46B4D" stroke-width="1" stroke-dasharray="3 2"/>
    <path d="M 560 300 L 560 284 M 556 289 L 560 284 L 564 289" fill="none" stroke="#C46B4D" stroke-width="1"/>
    <text x="566" y="296" font-size="8" fill="#C46B4D">-4px</text>

    <text x="336" y="368" font-size="9" fill="#5A534B">· flap rotateX −16°  spring 210/17</text>
    <text x="336" y="384" font-size="9" fill="#5A534B">· letter peeks y −22  spring 300/20</text>
    <text x="336" y="400" font-size="9" fill="#5A534B">· seal scale 1.06 · tilt −3°</text>
    <text x="336" y="416" font-size="9" fill="#5A534B">· whole envelope lifts −4px</text>
    <text x="336" y="432" font-size="9" fill="#C46B4D">touch: no hover — tap goes straight to 03</text>
  </g>

  <!-- arrow -->
  <text x="579" y="262" font-size="16" fill="#C46B4D" text-anchor="middle">›</text>
  <text x="579" y="278" font-size="8" fill="#8C857C" text-anchor="middle">click</text>

  <!-- ================= FRAME 03 — OPENING ================= -->
  <g>
    <rect x="600" y="112" width="240" height="330" fill="none" stroke="#E6DCCF"/>
    <text x="612" y="134" font-size="11" fill="#17130F" font-weight="bold" letter-spacing="1">03 — PICKED UP</text>
    <text x="828" y="134" font-size="10" fill="#5A534B" text-anchor="end">t 0.38 → 1.15s</text>

    <!-- flap swung open (up/back) -->
    <polygon points="630,200 810,200 720,148" fill="none" stroke="#17130F" stroke-opacity="0.35" stroke-dasharray="4 3"/>
    <!-- letter rising -->
    <rect x="648" y="158" width="144" height="52" rx="4" fill="#FCFAF7" stroke="#17130F" stroke-opacity="0.55"/>
    <line x1="662" y1="172" x2="762" y2="172" stroke="#E6DCCF"/>
    <line x1="662" y1="182" x2="748" y2="182" stroke="#E6DCCF"/>
    <line x1="662" y1="192" x2="730" y2="192" stroke="#E6DCCF"/>
    <!-- envelope body -->
    <rect x="630" y="200" width="180" height="112" rx="10" fill="#FFFEFB" stroke="#17130F" stroke-opacity="0.55"/>
    <!-- seal breaking -->
    <g opacity="0.45" transform="rotate(-28 720 252) scale(0.7) translate(309 108)">
      <circle cx="720" cy="252" r="14" fill="#C46B4D"/>
    </g>
    <!-- motion arrows -->
    <path d="M 720 236 L 720 150" fill="none" stroke="#C46B4D" stroke-width="1" stroke-dasharray="3 2"/>
    <path d="M 716 156 L 720 150 L 724 156" fill="none" stroke="#C46B4D" stroke-width="1"/>
    <path d="M 618 200 A 30 30 0 0 1 626 168" fill="none" stroke="#C46B4D" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="608" y="160" font-size="8" fill="#C46B4D">−172°</text>

    <text x="612" y="368" font-size="9" fill="#5A534B">· flap opens 0–0.38s · seal breaks</text>
    <text x="612" y="384" font-size="9" fill="#5A534B">· letter slides out, picked up toward</text>
    <text x="612" y="400" font-size="9" fill="#5A534B">  you: y −132 · scale 1.28 · tilt −2°</text>
    <text x="612" y="416" font-size="9" fill="#5A534B">· envelope falls back + fades 0.42s</text>
    <text x="612" y="432" font-size="9" fill="#C46B4D">held for a beat — hint: "— for you —"</text>
  </g>

  <!-- arrow -->
  <text x="855" y="262" font-size="16" fill="#C46B4D" text-anchor="middle">›</text>
  <text x="855" y="278" font-size="8" fill="#8C857C" text-anchor="middle">settle</text>

  <!-- ================= FRAME 04 — UNFOLDED (FORM) ================= -->
  <g>
    <rect x="876" y="112" width="240" height="330" fill="none" stroke="#E6DCCF"/>
    <text x="888" y="134" font-size="11" fill="#17130F" font-weight="bold" letter-spacing="1">04 — UNFOLDED</text>
    <text x="1104" y="134" font-size="10" fill="#5A534B" text-anchor="end">the form</text>

    <!-- form card (letter) with slight unfold tilt indicated -->
    <g>
      <rect x="906" y="156" width="180" height="180" rx="10" fill="#FFFEFB" stroke="#17130F" stroke-opacity="0.55"/>
      <!-- staple -->
      <rect x="986" y="156" width="20" height="4" rx="2" fill="#17130F" fill-opacity="0.35"/>
      <!-- fields -->
      <rect x="920" y="176" width="74" height="22" rx="5" fill="#F5EEE4" stroke="#E6DCCF"/>
      <rect x="998" y="176" width="74" height="22" rx="5" fill="#F5EEE4" stroke="#E6DCCF"/>
      <rect x="920" y="208" width="152" height="14" rx="7" fill="#F5EEE4" stroke="#E6DCCF"/>
      <rect x="920" y="228" width="152" height="14" rx="7" fill="#F5EEE4" stroke="#E6DCCF"/>
      <rect x="920" y="252" width="152" height="46" rx="6" fill="#F5EEE4" stroke="#E6DCCF"/>
      <!-- submit pill -->
      <rect x="920" y="308" width="152" height="18" rx="9" fill="#17130F"/>
      <!-- unfold arrow -->
      <path d="M 1108 168 A 34 34 0 0 1 1116 210" fill="none" stroke="#C46B4D" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="1112" y="158" font-size="8" fill="#C46B4D">rotateX 12°→0</text>
    </g>

    <text x="888" y="368" font-size="9" fill="#5A534B">· letter passes camera ×1.12 · 0.22s</text>
    <text x="888" y="384" font-size="9" fill="#5A534B">· form settles: scale 1.06→1 · y −20→0</text>
    <text x="888" y="400" font-size="9" fill="#5A534B">· rotateX 8°→0 · 0.45s · origin top</text>
    <text x="888" y="416" font-size="9" fill="#5A534B">· focus → NAME field @ ~1.55s</text>
    <text x="888" y="432" font-size="9" fill="#C46B4D">same paper — match cut, no fade-only swap</text>
  </g>

  <!-- arrow -->
  <text x="1131" y="262" font-size="16" fill="#C46B4D" text-anchor="middle">›</text>
  <text x="1131" y="278" font-size="8" fill="#8C857C" text-anchor="middle">submit</text>

  <!-- ================= FRAME 05 — SEALED ================= -->
  <g>
    <rect x="1152" y="112" width="240" height="330" fill="none" stroke="#E6DCCF"/>
    <text x="1164" y="134" font-size="11" fill="#17130F" font-weight="bold" letter-spacing="1">05 — SEALED</text>
    <text x="1380" y="134" font-size="10" fill="#5A534B" text-anchor="end">after send</text>

    <!-- envelope closed again -->
    <rect x="1182" y="200" width="180" height="112" rx="10" fill="#FFFEFB" stroke="#17130F" stroke-opacity="0.55"/>
    <polygon points="1182,200 1362,200 1272,263" fill="#F5EEE4" stroke="#17130F" stroke-opacity="0.55"/>
    <circle cx="1272" cy="258" r="14" fill="#C46B4D"/>
    <text x="1272" y="262" font-size="9" fill="#FCFAF7" text-anchor="middle" font-weight="bold">MZ</text>
    <!-- DRAFT SEALED stamp -->
    <g transform="rotate(-8 1272 178)">
      <rect x="1224" y="166" width="96" height="24" rx="3" fill="none" stroke="#C46B4D" stroke-width="1.5"/>
      <text x="1272" y="182" font-size="9" fill="#C46B4D" text-anchor="middle" font-weight="bold" letter-spacing="2">DRAFT SEALED</text>
    </g>
    <!-- stamp-in arrow -->
    <path d="M 1330 150 L 1306 164" fill="none" stroke="#C46B4D" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="1334" y="146" font-size="8" fill="#C46B4D">scale 1.9→1</text>

    <text x="1164" y="368" font-size="9" fill="#5A534B">· form collapses 0.2s</text>
    <text x="1164" y="384" font-size="9" fill="#5A534B">· envelope re-enters 0.5s · y 22→0</text>
    <text x="1164" y="400" font-size="9" fill="#5A534B">· seal stamps in · delay 0.35s</text>
    <text x="1164" y="416" font-size="9" fill="#5A534B">· stamp text · delay 0.62s</text>
    <text x="1164" y="432" font-size="9" fill="#C46B4D">buttons: open again / unseal → 04</text>
  </g>

  <!-- ================= TIMELINE ================= -->
  <line x1="48" y1="488" x2="1392" y2="488" stroke="#E6DCCF"/>
  <text x="48" y="516" font-size="11" fill="#17130F" font-weight="bold" letter-spacing="1">TIMING — ONE OPENING SEQUENCE ≈ 1.8s TOTAL (reduced-motion: instant)</text>

  <!-- timeline bar -->
  <g>
    <line x1="48" y1="560" x2="1000" y2="560" stroke="#17130F" stroke-opacity="0.4"/>
    <!-- ticks (axis: 0 → 2.0s) -->
    <line x1="48"  y1="554" x2="48"  y2="566" stroke="#17130F" stroke-opacity="0.5"/>
    <line x1="277" y1="554" x2="277" y2="566" stroke="#17130F" stroke-opacity="0.5"/>
    <line x1="506" y1="554" x2="506" y2="566" stroke="#17130F" stroke-opacity="0.5"/>
    <line x1="735" y1="554" x2="735" y2="566" stroke="#17130F" stroke-opacity="0.5"/>
    <line x1="964" y1="554" x2="964" y2="566" stroke="#17130F" stroke-opacity="0.5"/>
    <text x="48"  y="582" font-size="9" fill="#8C857C" text-anchor="middle">0s</text>
    <text x="277" y="582" font-size="9" fill="#8C857C" text-anchor="middle">0.5s</text>
    <text x="506" y="582" font-size="9" fill="#8C857C" text-anchor="middle">1.0s</text>
    <text x="735" y="582" font-size="9" fill="#8C857C" text-anchor="middle">1.5s</text>
    <text x="964" y="582" font-size="9" fill="#8C857C" text-anchor="middle">2.0s</text>

    <!-- primary story (top row) -->
    <rect x="48"  y="530" width="174" height="8" rx="4" fill="#C46B4D" fill-opacity="0.85"/>
    <text x="48"  y="524" font-size="9" fill="#5A534B">flap open · 0–0.38s</text>

    <rect x="240" y="530" width="211" height="8" rx="4" fill="#C46B4D" fill-opacity="0.85"/>
    <text x="240" y="524" font-size="9" fill="#5A534B">letter picked up · 0.42–0.88s</text>

    <rect x="451" y="530" width="124" height="8" rx="4" fill="#C46B4D" fill-opacity="0.45"/>
    <text x="451" y="524" font-size="9" fill="#5A534B">beat — held up · 0.88–1.15s</text>

    <rect x="676" y="530" width="206" height="8" rx="4" fill="#C46B4D" fill-opacity="0.85"/>
    <text x="676" y="524" font-size="9" fill="#5A534B">form settles · 1.37–1.82s</text>

    <!-- secondary motion (bottom row) -->
    <rect x="48"  y="594" width="119" height="8" rx="4" fill="#17130F" fill-opacity="0.25"/>
    <text x="48"  y="616" font-size="9" fill="#5A534B">seal break · 0–0.26s</text>

    <rect x="268" y="594" width="192" height="8" rx="4" fill="#17130F" fill-opacity="0.25"/>
    <text x="268" y="616" font-size="9" fill="#5A534B">envelope falls back · 0.48–0.9s</text>

    <rect x="575" y="594" width="101" height="8" rx="4" fill="#17130F" fill-opacity="0.25"/>
    <text x="575" y="616" font-size="9" fill="#5A534B">camera pass · 1.15–1.37s</text>

    <!-- focus marker -->
    <line x1="758" y1="550" x2="758" y2="570" stroke="#C46B4D" stroke-width="1.4" stroke-dasharray="3 2"/>
    <text x="766" y="548" font-size="9" fill="#C46B4D">focus → name @ ~1.55s</text>
  </g>

  <!-- easing curve -->
  <g>
    <rect x="1060" y="508" width="332" height="130" fill="none" stroke="#E6DCCF"/>
    <text x="1076" y="530" font-size="10" fill="#17130F" font-weight="bold" letter-spacing="1">EASING</text>
    <!-- curve plot -->
    <rect x="1076" y="544" width="120" height="78" fill="none" stroke="#E6DCCF"/>
    <path d="M 1076 622 C 1106 544, 1136 544, 1196 544" fill="none" stroke="#C46B4D" stroke-width="1.6"/>
    <circle cx="1106" cy="544" r="2.5" fill="#C46B4D"/>
    <circle cx="1136" cy="544" r="2.5" fill="#C46B4D"/>
    <text x="1212" y="560" font-size="9" fill="#5A534B">cubic-bezier(</text>
    <text x="1212" y="574" font-size="9" fill="#17130F">  0.25, 1, 0.5, 1</text>
    <text x="1212" y="588" font-size="9" fill="#5A534B">) — fast out,</text>
    <text x="1212" y="602" font-size="9" fill="#5A534B">soft landing.</text>
    <text x="1212" y="622" font-size="9" fill="#C46B4D">hover = springs, not beziers</text>
  </g>

  <!-- ================= RULES ================= -->
  <line x1="48" y1="668" x2="1392" y2="668" stroke="#E6DCCF"/>
  <text x="48" y="696" font-size="11" fill="#17130F" font-weight="bold" letter-spacing="1">RULES</text>
  <text x="48" y="722" font-size="10" fill="#5A534B">1 · reduced-motion users get an instant closed→open swap (framer useReducedMotion + CSS media query).</text>
  <text x="48" y="742" font-size="10" fill="#5A534B">2 · mobile / touch: no hover state — tap opens directly. hint text is always visible, not hover-gated.</text>
  <text x="48" y="762" font-size="10" fill="#5A534B">3 · the seal is the hero of the story — every state change is anchored to it (intact → breaks → stamps back on).</text>
  <text x="48" y="782" font-size="10" fill="#5A534B">4 · only transform + opacity animate — no layout thrash, no new deps (framer-motion only).</text>
  <text x="48" y="802" font-size="10" fill="#5A534B">5 · reverse journey on submit: form collapses → envelope slides back → seal stamps (05). "unseal" returns to 04.</text>

  <!-- footer -->
  <line x1="48" y1="830" x2="1392" y2="830" stroke="#E6DCCF"/>
  <text x="48" y="856" font-size="10" fill="#8C857C">muhammad zarrar — portfolio · contact envelope spec · implementation: src/components/Contact.tsx</text>
  <text x="1392" y="856" font-size="10" fill="#8C857C" text-anchor="end">import into figma: file › place › this .svg</text>
</svg>
